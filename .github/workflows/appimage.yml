name: AppImage

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/appimage.yml"
      - "packaging/appimage/**"
      - "src/**"
      - "data/**"
      - "meson.build"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip python3-gi python3-gi-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 \
            libgtk-4-bin libadwaita-1-0 libgdk-pixbuf-2.0-0 \
            librsvg2-common librsvg2-bin libglib2.0-bin libglib2.0-dev \
            libgtk-4-dev libadwaita-1-dev libgirepository1.0-dev \
            pkg-config shared-mime-info desktop-file-utils appstream \
            adwaita-icon-theme patchelf file wget curl xvfb
          python3 -m pip install --break-system-packages pyinstaller

      - name: Build AppImage
        run: bash packaging/appimage/build.sh
        env:
          ARCH: ${{ matrix.arch }}

      - name: Upload portable builds to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/mizuki/__init__.py)"
          tag="v${version}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "Mizuki ${version}" --generate-notes
          gh release upload "$tag" \
            "dist/Mizuki-${version}-${{ matrix.arch }}.AppImage" \
            "dist/Mizuki-${version}-${{ matrix.arch }}.run" \
            --clobber
